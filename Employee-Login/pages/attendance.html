<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attendance Management</title>

  <link rel="stylesheet" href="../CSS/attendance.css">

</head>

<body>

  <div class="container">

    <!-- Header -->

    <header class="page-header">

      <div>

        <h1>Employee Attendance Management</h1>

        <p id="currentDate"></p>

      </div>

      <a href="../dashboard.html" class="dashboard-btn">

        ← Back to Dashboard

      </a>

    </header>

    <!-- Summary Cards -->

    <section class="summary-container">

      <div class="summary-card">

        <h3>Total Employees</h3>

        <h2 id="totalEmployees">0</h2>

      </div>

      <div class="summary-card present-card">

        <h3>Present</h3>

        <h2 id="presentCount">0</h2>

      </div>

      <div class="summary-card absent-card">

        <h3>Absent</h3>

        <h2 id="absentCount">0</h2>

      </div>

      <div class="summary-card halfday-card">

        <h3>Half Day</h3>

        <h2 id="halfDayCount">0</h2>

      </div>

      <div class="summary-card wfh-card">

        <h3>Work From Home</h3>

        <h2 id="wfhCount">0</h2>

      </div>

    </section>

    <!-- Search & Filters -->

    <section class="filter-container">

      <input type="text" id="searchInput" placeholder="Search by Employee ID or Name">

      <select id="departmentFilter">

        <option value="">
          All Departments
        </option>

        <option value="IT">
          IT
        </option>

        <option value="HR">
          HR
        </option>

        <option value="Finance">
          Finance
        </option>

      </select>

      <select id="statusFilter">

        <option value="">All Attendance Status</option>

        <option value="Present">Present</option>

        <option value="Absent">Absent</option>

        <option value="Half Day">Half Day</option>

        <option value="WFH">Work From Home</option>

        <option value="Not Marked">Not Marked</option>

      </select>

      <button id="resetBtn">

        Reset Filters

      </button>

    </section>

    <!-- Attendance Table -->

    <section class="table-container">

      <table>

        <thead>

          <tr>

            <th>Employee ID</th>

            <th>Employee Name</th>

            <th>Department</th>

            <th>Select Attendance</th>

            <th>Current Status</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="attendanceTable">

        </tbody>

      </table>

    </section>

  </div>

  <script src="../../Employee-Directory/JS/employee-data.js"></script>
  <script src="../JS/attendance.js"></script>

</body>

</html>
