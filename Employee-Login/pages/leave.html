<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leave Management</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f6f9;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 50px auto;
    }

    .header {
      background: #1f2937;
      color: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }

    .header p {
      margin-top: 8px;
      color: #d1d5db;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 10px #ddd;
      text-decoration: none;
      color: #1f2937;
    }

    .card h2 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    .card p {
      color: #6b7280;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      text-decoration: none;
    }

    @media (max-width: 700px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }
  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>
        Leave Management
      </h1>

      <p>
        Employee Leave Management Module
      </p>

    </div>


    <div class="grid">

      <a href="../leave-management.html" class="card">

        <h2>
          Leave Request
        </h2>

        <p>
          Submit a new employee leave request.
        </p>

      </a>


      <a href="../leave-approval.html" class="card">

        <h2>
          Leave Approval
        </h2>

        <p>
          Approve or reject employee leave requests.
        </p>

      </a>


      <a href="../hr-dashboard.html" class="card">

        <h2>
          HR Dashboard
        </h2>

        <p>
          View real-time HR statistics.
        </p>

      </a>


      <a href="../employee-profile.html" class="card">

        <h2>
          Employee Profile
        </h2>

        <p>
          View employee information and reports.
        </p>

      </a>

    </div>


    <a href="../dashboard.html" class="back">
      Back to Dashboard
    </a>

  </div>

</body>

</html>
