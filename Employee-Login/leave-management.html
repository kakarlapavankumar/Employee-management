<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Employee Leave Request</title>

  <link rel="stylesheet" href="CSS/leave-management.css">

</head>

<body>

  <div class="page-container">

    <header class="page-header">

      <div>

        <h1>Leave Request Portal</h1>

        <p>
          Submit your employee leave request
        </p>

      </div>

      <div class="header-actions">

        <a href="leave-approval.html">
          HR Approval
        </a>

        <a href="hr-dashboard.html">
          HR Dashboard
        </a>

      </div>

    </header>


    <!-- SUCCESS -->

    <div id="successMessage" class="message success-message"></div>


    <!-- ERROR -->

    <div id="errorMessage" class="message error-message"></div>


    <!-- FORM -->

    <section class="form-card">

      <div class="card-title">

        <h2>Apply for Leave</h2>

        <span>
          All fields are required
        </span>

      </div>


      <form id="leaveForm">

        <div class="form-grid">


          <!-- EMPLOYEE ID -->

          <div class="form-group">

            <label for="employeeId">
              Employee ID
            </label>

            <input type="text" id="employeeId" placeholder="EMP001" required>

          </div>


          <!-- EMPLOYEE NAME -->

          <div class="form-group">

            <label for="employeeName">
              Employee Name
            </label>

            <input type="text" id="employeeName" placeholder="Employee Name" required>

          </div>


          <!-- DEPARTMENT -->

          <div class="form-group">

            <label for="department">
              Department
            </label>

            <input type="text" id="department" placeholder="Department" required>

          </div>


          <!-- LEAVE TYPE -->

          <div class="form-group">

            <label for="leaveType">
              Leave Type
            </label>

            <select id="leaveType" required>

              <option value="">
                Select Leave Type
              </option>

              <option value="Casual Leave">
                Casual Leave
              </option>

              <option value="Sick Leave">
                Sick Leave
              </option>

              <option value="Earned Leave">
                Earned Leave
              </option>

              <option value="Maternity Leave">
                Maternity Leave
              </option>

            </select>

          </div>


          <!-- FROM DATE -->

          <div class="form-group">

            <label for="fromDate">
              From Date
            </label>

            <input type="date" id="fromDate" required>

          </div>


          <!-- TO DATE -->

          <div class="form-group">

            <label for="toDate">
              To Date
            </label>

            <input type="date" id="toDate" required>

          </div>


          <!-- TOTAL DAYS -->

          <div class="form-group">

            <label>
              Total Leave Days
            </label>

            <div id="totalDays" class="total-days">
              0 Days
            </div>

          </div>


          <!-- REASON -->

          <div class="form-group full-width">

            <label for="reason">
              Reason
            </label>

            <textarea id="reason" rows="5" placeholder="Enter reason for leave..." required></textarea>

          </div>

        </div>


        <!-- BUTTONS -->

        <div class="form-actions">

          <button type="submit" class="btn btn-primary">
            Apply Leave
          </button>

          <button type="reset" class="btn btn-secondary">
            Reset
          </button>

        </div>

      </form>

    </section>

  </div>


  <script src="../Employee-Directory/JS/employee-data.js"></script>

  <script src="JS/leave-data.js"></script>

  <script src="JS/leave-management.js"></script>

</body>

</html>
