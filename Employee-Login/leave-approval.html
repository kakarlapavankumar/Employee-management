<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leave Approval Dashboard</title>

  <link rel="stylesheet" href="../CSS/leave-approval.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

  <!-- ==========================
            HEADER
    ========================== -->

  <header class="header">

    <div class="logo">

      <img src="../Employee-Login/assets/images/logo.png" alt="Logo">

      <div>

        <h2>Employee Management</h2>

        <p>HR Leave Approval Dashboard</p>

      </div>

    </div>

    <div class="header-right">

      <span id="currentDate"></span>

    </div>

  </header>

  <!-- ==========================
            MAIN
    ========================== -->

  <main class="container">

    <div class="page-title">

      <h1>Leave Approval Dashboard</h1>

      <p>Approve, Reject or Cancel employee leave requests.</p>

    </div>

    <!-- ==========================
                SUMMARY CARDS
        ========================== -->

    <section class="summary-cards">

      <div class="card">

        <h3>Pending Requests</h3>

        <h2 id="pendingCount">0</h2>

      </div>

      <div class="card">

        <h3>Approved Leaves</h3>

        <h2 id="approvedCount">0</h2>

      </div>

      <div class="card">

        <h3>Rejected Leaves</h3>

        <h2 id="rejectedCount">0</h2>

      </div>

    </section>

    <!-- ==========================
                SEARCH
        ========================== -->

    <section class="search-section">

      <input type="text" id="searchInput" placeholder="Search by Employee ID or Name...">

    </section>

    <!-- ==========================
                TABLE
        ========================== -->

    <section class="table-container">

      <table>

        <thead>

          <tr>

            <th>Employee ID</th>

            <th>Name</th>

            <th>Department</th>

            <th>Leave Type</th>

            <th>From Date</th>

            <th>To Date</th>

            <th>Total Days</th>

            <th>Status</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="leaveApprovalTable">

          <!-- JavaScript -->

        </tbody>

      </table>

    </section>

  </main>

  <!-- ==========================
            SCRIPTS
    ========================== -->

  <script src="../Employee-Directory/JS/employee-data.js"></script>

  <script src="../JS/leave-data.js"></script>

  <script src="../JS/attendance.js"></script>

  <script src="../JS/leave-management.js"></script>

  <script src="../JS/leave-approval.js"></script>

</body>

</html>
