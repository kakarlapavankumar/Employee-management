<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leave Approval Dashboard</title>

  <link rel="stylesheet" href="CSS/leave-approval.css">

</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header class="page-header">

      <div>
        <h1>Leave Approval Dashboard</h1>

        <p>
          HR Leave Request Management
        </p>
      </div>

      <div class="header-actions">

        <a href="leave-management.html">
          Apply Leave
        </a>

        <a href="hr-dashboard.html">
          HR Dashboard
        </a>

        <a href="dashboard.html">
          Dashboard
        </a>

      </div>

    </header>


    <!-- SUMMARY CARDS -->

    <section class="summary-grid">

      <div class="summary-card pending-card">

        <h3>
          Pending Requests
        </h3>

        <strong id="pendingCount">
          0
        </strong>

      </div>


      <div class="summary-card approved-card">

        <h3>
          Approved Leaves
        </h3>

        <strong id="approvedCount">
          0
        </strong>

      </div>


      <div class="summary-card rejected-card">

        <h3>
          Rejected Leaves
        </h3>

        <strong id="rejectedCount">
          0
        </strong>

      </div>

    </section>


    <!-- LEAVE REQUEST TABLE -->

    <section class="table-card">

      <div class="table-header">

        <h2>
          Leave Requests
        </h2>

        <span id="requestCount">
          0 Requests
        </span>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>Employee ID</th>

              <th>Employee Name</th>

              <th>Department</th>

              <th>Leave Type</th>

              <th>Total Days</th>

              <th>Status</th>

              <th>Actions</th>

            </tr>

          </thead>


          <!-- THIS ID MUST MATCH JS -->

          <tbody id="leaveTableBody">

          </tbody>

        </table>

      </div>

    </section>


  </div>


  <!-- SHARED LEAVE DATA -->

  <script src="JS/leave-data.js"></script>

  <!-- APPROVAL LOGIC -->

  <script src="JS/leave-approval.js"></script>


</body>

</html>
