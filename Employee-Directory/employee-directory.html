<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory</title>

  <link rel="stylesheet" href="CSS/employee-directory.css">
</head>

<body>

  <header>
    <h1>Employee Directory</h1>
    <p>View all employee details</p>
  </header>

  <section class="controls">

    <input type="text" id="searchInput" placeholder="Search by Employee ID or Name">

    <select id="departmentFilter">
      <option value="">All Departments</option>
    </select>

    <select id="designationFilter">
      <option value="">All Designations</option>
    </select>

    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>

    <select id="sortOption">
      <option value="">Sort By</option>
      <option value="nameAsc">Name (A-Z)</option>
      <option value="nameDesc">Name (Z-A)</option>
      <option value="idAsc">ID Ascending</option>
      <option value="idDesc">ID Descending</option>
    </select>

    <button id="resetBtn">Reset Filters</button>

  </section>

  <section class="employee-container" id="employeeContainer">

  </section>

  <script src="js/employees.js"></script>
  <script src="js/employee-directory.js"></script>

</body>

</html>
